<html>

<head>
  <title>JS Mazes</title>
  <link rel="stylesheet" type="text/css" href="mazes.css">
</head>

<body>
  <div id="canvasdiv"><canvas id="gs" class="gs"></canvas></div>
  
  <script src="mazes.js"></script>
  <div id="menu">
    <button type="button" id="generate"> Generate </button>
    <label for="ncellx">X:</label>
    <input type="number" id="ncellx" name="ncellx" min="1" max="100" value="10">

    <label for="ncellY">Y:</label>
    <input type="number" id="ncelly" name="ncelly" min="1" max="100" value="10">

    <label for="algorithm">Algorithm:</label>
    <select id="algorithm" name="algorithm"></select>

    <label for="color">Color</label>
    <input id="color" type="color" value="#730071" />

    <button type="button" id="openings">Make openings</button>
  </div>
</body>

</html>
